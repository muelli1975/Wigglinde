[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wigglinde"
version = "0.0.1"
description = "Stereo SBS view-synthesis quality prototype"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.0,<3", "Pillow>=11,<13", "imageio-ffmpeg>=0.6,<1"]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.20,<2"]
cuda = ["onnxruntime-gpu>=1.20,<2"]

[project.scripts]
wigglinde-prototype = "wigglinde.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
