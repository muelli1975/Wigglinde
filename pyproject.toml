[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wigglinde"
version = "1.1.dev2"
description = "Stereo SBS wiggle converter"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.0,<3", "Pillow>=11,<13", "imageio-ffmpeg>=0.6,<1", "customtkinter>=5.2,<6", "onnxruntime==1.24.4; sys_platform != 'win32' and (sys_platform != 'darwin' or platform_machine != 'x86_64')", "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'", "psutil>=7,<8; sys_platform == 'darwin'", "onnxruntime-directml==1.24.4; sys_platform == 'win32'"]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.20,<2; sys_platform != 'win32'"]
cuda = ["onnxruntime-gpu>=1.20,<2"]

[project.scripts]
wigglinde-prototype = "wigglinde.cli:main"
wigglinde = "wigglinde.app:main"

[tool.setuptools.packages.find]
where = ["src"]
