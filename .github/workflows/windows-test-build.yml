name: Portable Windows test build
on:
  push:
    branches: [testversion-0.1]
    paths: ['src/**', 'tools/**', 'tests/**', 'launch.py', 'pyproject.toml', 'README.md', 'Liesmich.md', 'LICENSE', '.github/workflows/windows-test-build.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: '1'
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: model-cache
        with:
          path: models/las2
          key: las2-m-${{ hashFiles('tools/export_las2.py') }}
      - name: Export and verify LAS2-M
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install timm onnx onnxscript onnxruntime numpy
          git clone https://github.com/TomTomTommi/LiteAnyStereo.git las2-reference
          git -C las2-reference checkout 8c97bd4c4da3712c2ac60003a23201dfdb5935f4
          curl -fL --retry 3 -o LAS2_M.pth https://huggingface.co/tomtomtommi/LiteAnyStereoV2/resolve/17788d91618646fa781a14462e2926a034b9f49d/LAS2_M.pth
          python tools/export_las2.py --source las2-reference --weights LAS2_M.pth --output models/las2/LAS2_M_dynamic.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: las2-m-onnx
          path: models/las2
          retention-days: 14
  windows:
    needs: model
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: las2-m-onnx
          path: models/las2
      - name: Install application and packaging dependencies
        run: python -m pip install -e . pyinstaller
      - name: Get pinned native prerequisites
        shell: pwsh
        run: |
          git clone https://gitlab.com/mpeg-i-visual/rvs.git rvs-reference
          git -C rvs-reference checkout d757a353c7f84d228ac30c179d6ff9de356c6101
          git clone https://github.com/TomTomTommi/LiteAnyStereo.git las2-reference
          git -C las2-reference checkout 8c97bd4c4da3712c2ac60003a23201dfdb5935f4
          curl.exe -fL --retry 3 -o opencv.exe https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe
          if ((Get-FileHash opencv.exe -Algorithm SHA256).Hash.ToLower() -ne 'bff38466091c313dac21a0b73eea8278316a89c1d434c6f0b10697e087670168') { throw 'OpenCV checksum mismatch' }
          7z x opencv.exe -oopencv-sdk -y | Out-Null
      - name: Build the RVS CPU backend
        shell: pwsh
        run: |
          cmake -S tools/rvs/runtime -B build/rvs -DRVS_SOURCE_DIR="$pwd/rvs-reference" -DOpenCV_DIR="$pwd/opencv-sdk/opencv/build/x64/vc16/lib"
          cmake --build build/rvs --config Release --parallel 4
      - name: Fast geometry and export checks
        run: python -m unittest discover -s tests -v
      - name: Package and test the actual Windows application
        run: python tools/package_windows.py --opencv opencv-sdk/opencv --rvs rvs-reference --las2 las2-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wigglinde-0.1-Test1-Windows
          path: |
            dist/Wigglinde_0.1_Test1_Windows.zip
            output/windows-smoke.json
          if-no-files-found: warn
          retention-days: 30
