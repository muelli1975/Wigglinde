name: Portable Windows test build
on:
  push:
    branches: [testversion-0.1]
    paths: ['src/**', 'tools/**', 'tests/**', 'launch.py', 'pyproject.toml', 'README.md', 'Liesmich.md', 'LICENSE', 'assets/**', '.github/workflows/windows-test-build.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: '1'
jobs:
  model:
    strategy:
      matrix:
        model: [h]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: model-cache
        with:
          path: models/las2
          key: las2-${{ matrix.model }}-${{ hashFiles('tools/export_las2.py') }}
      - name: Export and verify LAS2-${{ matrix.model }}
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install timm onnx onnxscript onnxruntime numpy
          git clone https://github.com/TomTomTommi/LiteAnyStereo.git las2-reference
          git -C las2-reference checkout 8c97bd4c4da3712c2ac60003a23201dfdb5935f4
          model_letter=$(echo '${{ matrix.model }}' | tr '[:lower:]' '[:upper:]')
          curl -fL --retry 3 -o LAS2.pth "https://huggingface.co/tomtomtommi/LiteAnyStereoV2/resolve/17788d91618646fa781a14462e2926a034b9f49d/LAS2_${model_letter}.pth"
          python tools/export_las2.py --model-size '${{ matrix.model }}' --source las2-reference --weights LAS2.pth --output "models/las2/LAS2_${model_letter}_dynamic.onnx"
      - uses: actions/upload-artifact@v4
        with:
          name: las2-${{ matrix.model }}-onnx
          path: models/las2
          retention-days: 14
  runtime:
    runs-on: windows-2022
    concurrency:
      group: wigglinde-ort-dml-no-telemetry-v3
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: ort-cache
        with:
          path: runtime-wheel
          key: ort-dml-1.24.4-no-telemetry-py312-v3-vs2022
      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.ort-cache.outputs.cache-hit != 'true'
      - name: Build DirectML runtime without telemetry
        if: steps.ort-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.24.4 https://github.com/microsoft/onnxruntime.git onnxruntime-reference
          if ((git -C onnxruntime-reference rev-parse HEAD) -ne '2d924974ef147392ced8409d36bd6d2e7fcc8a74') { throw 'Unexpected ONNX Runtime revision' }
          python -m pip install numpy packaging setuptools wheel ninja
          python onnxruntime-reference/tools/ci_build/build.py --build_dir "$pwd/build/ort" --config Release --build_wheel --skip_tests --parallel 4 --use_dml --cmake_generator Ninja --cmake_extra_defines onnxruntime_USE_TELEMETRY=OFF onnxruntime_BUILD_UNIT_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'ONNX Runtime build failed' }
          if (-not (Select-String -Quiet -Path build/ort/Release/CMakeCache.txt -Pattern '^onnxruntime_USE_TELEMETRY:BOOL=OFF$')) { throw 'Telemetry must be disabled at compile time' }
          New-Item -ItemType Directory -Force runtime-wheel | Out-Null
          Copy-Item build/ort/Release/dist/*.whl runtime-wheel/
          New-Item -ItemType Directory -Force runtime-wheel/licenses | Out-Null
          Copy-Item onnxruntime-reference/LICENSE runtime-wheel/licenses/ONNX-Runtime-LICENSE.txt
          Copy-Item onnxruntime-reference/ThirdPartyNotices.txt runtime-wheel/licenses/ONNX-Runtime-ThirdPartyNotices.txt
          Get-ChildItem build/ort -Recurse -File -Filter LICENSE* | Where-Object { $_.FullName -match '(?i)directml' } | ForEach-Object { Copy-Item $_.FullName (Join-Path runtime-wheel/licenses ('DirectML-' + $_.Name)) }
          '{"revision":"2d924974ef147392ced8409d36bd6d2e7fcc8a74","version":"1.24.4","telemetry_compiled":false}' | Set-Content -Encoding utf8 runtime-wheel/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: directml-no-telemetry
          path: runtime-wheel
          retention-days: 14
  windows:
    needs: [model, runtime]
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: las2-*-onnx
          merge-multiple: true
          path: models/las2
      - uses: actions/download-artifact@v4
        with:
          name: directml-no-telemetry
          path: runtime-wheel
      - name: Install application and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install (Get-ChildItem runtime-wheel/*.whl).FullName
          python -m pip install -e . pyinstaller
      - name: Get pinned native prerequisites
        shell: pwsh
        run: |
          git clone https://gitlab.com/mpeg-i-visual/rvs.git rvs-reference
          git -C rvs-reference checkout d757a353c7f84d228ac30c179d6ff9de356c6101
          git clone https://github.com/TomTomTommi/LiteAnyStereo.git las2-reference
          git -C las2-reference checkout 8c97bd4c4da3712c2ac60003a23201dfdb5935f4
          curl.exe -fL --retry 3 -o opencv.exe https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe
          if ((Get-FileHash opencv.exe -Algorithm SHA256).Hash.ToLower() -ne 'bff38466091c313dac21a0b73eea8278316a89c1d434c6f0b10697e087670168') { throw 'OpenCV checksum mismatch' }
          7z x opencv.exe -oopencv-sdk -y | Out-Null
      - name: Build the RVS CPU backend
        shell: pwsh
        run: |
          cmake -S tools/rvs/runtime -B build/rvs -DRVS_SOURCE_DIR="$pwd/rvs-reference" -DOpenCV_DIR="$pwd/opencv-sdk/opencv/build/x64/vc16/lib"
          cmake --build build/rvs --config Release --parallel 4
      - name: Fast geometry and export checks
        run: python -m unittest discover -s tests -v
      - name: Verify serial and parallel native RVS output
        shell: pwsh
        run: |
          $env:PATH = "$pwd/opencv-sdk/opencv/build/x64/vc16/bin;$env:PATH"
          Get-ChildItem 'C:/Program Files/Microsoft Visual Studio/*/*/VC/Redist/MSVC/*/x64/Microsoft.VC*.OpenMP/vcomp140.dll' | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName build/rvs/Release/ }
          python tools/rvs/check_parallel.py --renderer build/rvs/Release/wigglinde_rvs.exe --output output/rvs-parallel.json
      - name: Package and test the actual Windows application
        run: python tools/package_windows.py --opencv opencv-sdk/opencv --rvs rvs-reference --las2 las2-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wigglinde-0.1-Test5-Windows
          path: |
            dist/Wigglinde_0.1_Test5_Windows.zip
            output/windows-smoke.json
            output/gui-build-check.png
            output/rvs-parallel.json
          if-no-files-found: warn
          retention-days: 30
