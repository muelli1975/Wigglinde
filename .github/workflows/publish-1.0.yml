name: Normalize Windows 1.0 archive name

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-1.0.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wigglinde-1.0
  cancel-in-progress: false

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rename the verified existing asset without rebuilding or reuploading
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo, tag = 'v1.0';
            const oldName = 'Wigglinde_1.0_Windows.zip';
            const newName = 'Wigglinde_1.0_Windows_x64.zip';
            const expectedDigest = 'sha256:f8275d65b5a1691f03e2f0c520afc4276e82180ebdc942dddc6349fc4934c5ea';
            const expectedSize = 185371902, expectedId = 650707400;
            const release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            const ref = (await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag})).data;
            if (ref.object.sha !== '642773fd642d28e30959a4df554829e4d56493da') throw new Error('Release tag differs.');
            const old = release.assets.find(a => a.name === oldName);
            const renamed = release.assets.find(a => a.name === newName);
            if (old && renamed) throw new Error('Both archive names exist.');
            const asset = renamed || old;
            if (!asset || asset.id !== expectedId || asset.digest !== expectedDigest || asset.size !== expectedSize) throw new Error('Existing Windows asset identity differs.');
            if (old) await github.rest.repos.updateReleaseAsset({owner, repo, asset_id: asset.id, name: newName});
            const checked = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            const final = checked.assets.find(a => a.name === newName);
            if (!final || final.id !== expectedId || final.digest !== expectedDigest || final.size !== expectedSize || checked.assets.some(a => a.name === oldName)) throw new Error('Rename verification failed.');
            for (const before of release.assets.filter(a => a.id !== expectedId)) {
              const after = checked.assets.find(a => a.id === before.id);
              if (!after || after.name !== before.name || after.digest !== before.digest || after.size !== before.size) throw new Error('Another release asset changed.');
            }
            core.notice('Renamed the existing verified ZIP: ' + final.browser_download_url);
