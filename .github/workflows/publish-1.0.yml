name: Publish verified 1.0 packages

on:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Wigglinde-1.0-*
          path: packages
      - name: Verify all platform packages and update the existing 1.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path'), crypto = require('crypto');
            const owner = context.repo.owner, repo = context.repo.repo, tag = 'v1.0';
            const expectedTag = 'db215d8460eb798b4f4b4e914cab0ef6e3a2194f';
            const renderer = 'RVS CPU Precision 1 Simple 5';
            const previous = {
              "Linux_x64": "sha256:810e1eade79f50e2596445fc7b91806cd771b8c2bae6e26e565ac14bea704e98",
              "macOS_AppleSilicon": "sha256:ba1d0874422e1ddb5db620bd2816e64af99028197526d872a9a9aa04dcdfdac5",
              "macOS_Intel": "sha256:9d3376767e46bf44ff1f8f5276ffb63929090ce000af0580dfdfe6461b6dbdaf",
              "Windows_x64": "sha256:13cd863e25fa1890641a602490b0b6d05460ed730976a0f68e4790c40d3ab446"
            };
            const release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            const ref = (await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag})).data;
            if (![expectedTag, context.sha].includes(ref.object.sha)) throw new Error('Release tag changed.');
            const verified = [];
            for (const label of Object.keys(previous)) {
              const root = path.join('packages', 'Wigglinde-1.0-' + label);
              const report = JSON.parse(fs.readFileSync(path.join(root, 'output/package-verification.json')));
              const smoke = JSON.parse(fs.readFileSync(path.join(root, 'output', label === 'Windows_x64' ? 'windows-smoke.json' : 'native-smoke.json')));
              const parallel = JSON.parse(fs.readFileSync(path.join(root, 'output/rvs-parallel.json')));
              const expectedName = 'Wigglinde_1.0_' + label + (label === 'Linux_x64' ? '.tar.gz' : '.zip');
              if (report.status !== 'passed' || report.platform !== label || report.commit !== context.sha || report.renderer !== renderer || report.filename !== expectedName || smoke.status !== 'passed' || parallel.status !== 'passed') throw new Error('Package checks failed: ' + label);
              if (label === 'Windows_x64' ? !report.actual_packaged_application_tested || !smoke.mixed_model_bundled : !report.actual_extracted_package_tested || smoke.mixed_model_bundled) throw new Error('Packaged runtime checks missing: ' + label);
              if (!smoke.formats.every(r => r.status === 'passed' && r.renderer === renderer && r.blending?.BlendingMethod === 'Simple' && r.blending?.BlendingFactor === 5)) throw new Error('Wrong actual renderer: ' + label);
              const data = fs.readFileSync(path.join(root, label === 'Windows_x64' ? 'dist' : 'release', expectedName));
              const digest = 'sha256:' + crypto.createHash('sha256').update(data).digest('hex');
              if (data.length !== report.bytes || digest !== 'sha256:' + report.sha256) throw new Error('Package identity differs: ' + label);
              const old = release.assets.find(a => a.name === expectedName);
              if (!old || ![previous[label], digest].includes(old.digest)) throw new Error('Existing asset changed: ' + label);
              verified.push({name: expectedName, data, digest, size: data.length, old});
            }
            require('child_process').execFileSync('python', ['tools/publish_color_update.py', '--root', 'packages', '--config', '.github/color-update.json'], {stdio:'inherit',env:process.env});
