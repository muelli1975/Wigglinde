name: Portable Linux and macOS builds

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ORT_DISABLE_TELEMETRY: '1'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: Linux_x64
          - runner: macos-15
            label: macOS_AppleSilicon
          - runner: macos-15-intel
            label: macOS_Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth fonts-dejavu-core libgl1 libegl1 libxkbcommon0 libdbus-1-3
      - name: macOS OpenMP
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install application and packaging dependencies
        run: python -m pip install -e . pyinstaller==6.19.0
      - name: Reuse the verified Float32 H export
        uses: actions/download-artifact@v4
        with:
          name: las2-h-onnx
          run-id: 39041230523
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: models/las2
      - name: Reuse verified Float32 Middlebury export
        uses: actions/download-artifact@v4
        with:
          name: igev-middlebury-onnx
          run-id: 39124980286
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: models/igev
      - name: Get pinned native sources
        shell: bash
        run: |
          git clone https://gitlab.com/mpeg-i-visual/rvs.git rvs-reference
          git -C rvs-reference checkout d757a353c7f84d228ac30c179d6ff9de356c6101
          git clone --filter=blob:none --no-checkout https://github.com/TomTomTommi/LiteAnyStereo.git las2-reference
          git -C las2-reference checkout 8c97bd4c4da3712c2ac60003a23201dfdb5935f4
          git clone https://github.com/gangweiX/IGEV-plusplus.git igev-reference
          git -C igev-reference checkout 099dec97989780d151700459c682df1cc2c18e88
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git opencv-reference
          test "$(git -C opencv-reference rev-parse HEAD)" = 71d3237a093b60a27601c20e9ee6c3e52154e8b1
      - uses: actions/cache/restore@v4
        id: opencv
        with:
          path: opencv-install
          key: opencv-static-4.10.0-${{ matrix.label }}-v3
      - name: Build minimal portable OpenCV
        if: steps.opencv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake -S opencv-reference -B build/opencv -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/opencv-install" \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_LIST=core,imgproc,photo,imgcodecs \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_opencv_apps=OFF \
            -DBUILD_JAVA=OFF -DBUILD_opencv_python2=OFF -DBUILD_opencv_python3=OFF \
            -DWITH_OPENCL=OFF -DWITH_IPP=OFF -DWITH_TBB=OFF -DWITH_OPENMP=OFF \
            -DWITH_FFMPEG=OFF -DWITH_GSTREAMER=OFF -DWITH_QT=OFF -DWITH_GTK=OFF \
            -DWITH_PROTOBUF=OFF -DBUILD_PROTOBUF=OFF -DWITH_ADE=OFF -DWITH_FLATBUFFERS=OFF \
            -DWITH_OPENEXR=OFF -DWITH_TIFF=OFF -DWITH_WEBP=OFF -DWITH_JASPER=OFF -DWITH_OPENJPEG=OFF \
            -DWITH_JPEG=OFF -DWITH_PNG=ON -DBUILD_PNG=ON -DBUILD_ZLIB=ON
          cmake --build build/opencv --parallel 4
          cmake --install build/opencv
      - uses: actions/cache/save@v4
        if: steps.opencv.outputs.cache-hit != 'true'
        with:
          path: opencv-install
          key: opencv-static-4.10.0-${{ matrix.label }}-v3
      - name: Build the RVS CPU adapter
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            extra+=("-DOpenMP_ROOT=$(brew --prefix libomp)")
          fi
          cmake -S tools/rvs/runtime -B build/rvs -DCMAKE_BUILD_TYPE=Release \
            -DRVS_SOURCE_DIR="$PWD/rvs-reference" -DOpenCV_DIR="$PWD/opencv-install/lib/cmake/opencv4" "${extra[@]}"
          cmake --build build/rvs --parallel 4
      - name: Source and serial/parallel RVS checks
        run: |
          python -m unittest discover -s tests -v
          python tools/rvs/check_parallel.py --renderer build/rvs/wigglinde_rvs --output output/rvs-parallel.json
      - name: Build and check extracted Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 2560x1920x24' python tools/package_unix.py --label '${{ matrix.label }}'
      - name: Build and check extracted macOS package
        if: runner.os == 'macOS'
        run: python tools/package_unix.py --label '${{ matrix.label }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wigglinde-1.1-${{ matrix.label }}
          path: |
            release/Wigglinde_1.1_${{ matrix.label }}.*
            output/native-smoke.json
            output/rvs-parallel.json
            output/package-verification.json
          if-no-files-found: warn
          retention-days: 30
