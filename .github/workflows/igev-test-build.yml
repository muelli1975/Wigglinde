name: IGEV Middlebury test build
on:
  push:
    branches: [test-igev-middlebury-1.1]
    paths: ['src/**', 'tools/**', 'tests/**', 'launch.py', 'pyproject.toml', 'README.md', 'README_DE.md', 'THIRD_PARTY.md', 'BUILD.md', 'LICENSE', 'assets/**', '.github/workflows/igev-test-build.yml', '.github/workflows/unix-release-build.yml', '.github/workflows/publish-1.0.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  ORT_DISABLE_TELEMETRY: '1'
concurrency:
  group: wigglinde-igev-test
  cancel-in-progress: true
jobs:
  models:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build-only dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . onnx==1.17.0 timm==0.5.4 scipy
      - name: Pinned IGEV source and official Middlebury checkpoint
        shell: python
        run: |
          from pathlib import Path
          import subprocess,urllib.request,hashlib
          subprocess.run(['git','clone','https://github.com/gangweiX/IGEV-plusplus.git','igev-reference'],check=True)
          subprocess.run(['git','-C','igev-reference','checkout','099dec97989780d151700459c682df1cc2c18e88'],check=True)
          urllib.request.urlretrieve('https://drive.usercontent.google.com/download?id=1R9a2YP4kaAv4oT0wtwTnWXrb82Shpp3O&export=download&confirm=t','middlebury.pth')
          assert hashlib.sha256(Path('middlebury.pth').read_bytes()).hexdigest()=='eecddfa4549dc6180ce96e7ed8bf24a0bb0d702d5e747623eac54abed1fd7579'
      - name: Export sixteen iterations and validate native ONNX and mixed graphs
        run: |
          python tools/igev/export.py --source igev-reference --weights middlebury.pth --output models/igev/IGEV_Middlebury_dynamic.onnx
          python tools/igev/verify.py --model models/igev/IGEV_Middlebury_dynamic.onnx --report output/igev-native-onnx.json
          python tools/igev/convert_mixed.py --source models/igev/IGEV_Middlebury_dynamic.onnx --output models/igev/IGEV_Middlebury_mixed.onnx --report output/igev-mixed.json
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: igev-middlebury-onnx
          path: |
            models/igev/*.onnx
            models/igev/*.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: igev-conversion-verification
          path: output/igev-*.json
          if-no-files-found: warn
          retention-days: 30
  windows:
    needs: models
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: las2-h-onnx
          run-id: 39041230523
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: models/las2
      - uses: actions/download-artifact@v4
        with:
          name: directml-no-telemetry
          run-id: 39041230523
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runtime-wheel
      - uses: actions/download-artifact@v4
        with:
          name: las2-sml-onnx
          run-id: 39120123438
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: models/las2
      - uses: actions/download-artifact@v4
        with:
          name: igev-middlebury-onnx
          path: models/igev
      - name: Install application and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install (Get-ChildItem runtime-wheel/*.whl).FullName
          python -m pip install -e . pyinstaller
      - name: Get pinned native prerequisites
        shell: pwsh
        run: |
          git clone https://gitlab.com/mpeg-i-visual/rvs.git rvs-reference
          git -C rvs-reference checkout d757a353c7f84d228ac30c179d6ff9de356c6101
          git clone https://github.com/TomTomTommi/LiteAnyStereo.git las2-reference
          git -C las2-reference checkout 8c97bd4c4da3712c2ac60003a23201dfdb5935f4
          git clone https://github.com/gangweiX/IGEV-plusplus.git igev-reference
          git -C igev-reference checkout 099dec97989780d151700459c682df1cc2c18e88
          curl.exe -fL --retry 3 -o opencv.exe https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe
          if ((Get-FileHash opencv.exe -Algorithm SHA256).Hash.ToLower() -ne 'bff38466091c313dac21a0b73eea8278316a89c1d434c6f0b10697e087670168') { throw 'OpenCV checksum mismatch' }
          7z x opencv.exe -oopencv-sdk -y | Out-Null
      - name: Build the RVS CPU backend
        shell: pwsh
        run: |
          cmake -S tools/rvs/runtime -B build/rvs -DRVS_SOURCE_DIR="$pwd/rvs-reference" -DOpenCV_DIR="$pwd/opencv-sdk/opencv/build/x64/vc16/lib"
          cmake --build build/rvs --config Release --parallel 4
      - name: Fast geometry and export checks
        run: python -m unittest discover -s tests -v
      - name: Verify serial and parallel native RVS output
        shell: pwsh
        run: |
          $env:PATH = "$pwd/opencv-sdk/opencv/build/x64/vc16/bin;$env:PATH"
          Get-ChildItem 'C:/Program Files/Microsoft Visual Studio/*/*/VC/Redist/MSVC/*/x64/Microsoft.VC*.OpenMP/vcomp140.dll' | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName build/rvs/Release/ }
          python tools/rvs/check_parallel.py --renderer build/rvs/Release/wigglinde_rvs.exe --output output/rvs-parallel.json
      - name: Package and test the actual Windows application
        run: python tools/package_windows.py --opencv opencv-sdk/opencv --rvs rvs-reference --las2 las2-reference --igev igev-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wigglinde-1.1-Test4-Windows_x64
          path: |
            dist/Wigglinde_1.1_Test4_Windows_x64.zip
            output/package-verification.json
            output/windows-smoke.json
            output/gui-build-check.png
            output/rvs-parallel.json
          if-no-files-found: warn
          retention-days: 30
