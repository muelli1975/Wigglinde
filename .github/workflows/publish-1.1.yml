name: Publish verified Wigglinde 1.1 packages
on:
  workflow_call:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Wigglinde-1.1-*
          path: packages
      - name: Verify all four packages, stage assets and publish 1.1
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path'), crypto = require('crypto');
            const owner = context.repo.owner, repo = context.repo.repo, tag = 'v1.1';
            const renderer = 'RVS CPU Precision 1 Simple 5';
            const labels = ['Windows_x64', 'Linux_x64', 'macOS_AppleSilicon', 'macOS_Intel'];
            const models = ['LAS2-H', 'IGEV++ Middlebury'];
            const verified = [];
            for (const label of labels) {
              const root = path.join('packages', 'Wigglinde-1.1-' + label);
              const report = JSON.parse(fs.readFileSync(path.join(root, 'output/package-verification.json')));
              const smoke = JSON.parse(fs.readFileSync(path.join(root, 'output', label === 'Windows_x64' ? 'windows-smoke.json' : 'native-smoke.json')));
              const parallel = JSON.parse(fs.readFileSync(path.join(root, 'output/rvs-parallel.json')));
              const name = 'Wigglinde_1.1_' + label + (label === 'Linux_x64' ? '.tar.gz' : '.zip');
              if (report.status !== 'passed' || report.version !== '1.1' || report.platform !== label || report.commit !== context.sha || report.renderer !== renderer || report.filename !== name || JSON.stringify(report.models) !== JSON.stringify(models) || smoke.status !== 'passed' || parallel.status !== 'passed') throw new Error('Package checks failed: ' + label);
              if (label === 'Windows_x64' ? !report.actual_packaged_application_tested || !smoke.mixed_model_bundled : !report.actual_extracted_package_tested || smoke.mixed_model_bundled) throw new Error('Packaged application not tested: ' + label);
              if (!smoke.model_names_separate || !smoke.depth_model_metadata || smoke.model_checks.length !== 1 || smoke.model_checks[0].model !== models[1] || smoke.model_checks[0].iterations !== 16 || smoke.model_checks[0].status !== 'passed') throw new Error('Middlebury or filename checks missing: ' + label);
              if (smoke.model_metadata.length !== (label === 'Windows_x64' ? 4 : 2) || !smoke.model_metadata.every(m => models.includes(m.model))) throw new Error('Wrong bundled model set: ' + label);
              if (!smoke.formats.every(r => r.status === 'passed' && r.renderer === renderer && r.blending?.BlendingMethod === 'Simple' && r.blending?.BlendingFactor === 5)) throw new Error('Wrong renderer: ' + label);
              const data = fs.readFileSync(path.join(root, label === 'Windows_x64' ? 'dist' : 'release', name));
              const digest = 'sha256:' + crypto.createHash('sha256').update(data).digest('hex');
              if (data.length !== report.bytes || digest !== 'sha256:' + report.sha256) throw new Error('Package digest differs: ' + label);
              verified.push({name, data, digest, size: data.length});
            }
            let ref;
            try { ref = (await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag})).data; }
            catch (e) { if (e.status !== 404) throw e; }
            if (ref && ref.object.sha !== context.sha) throw new Error('Version tag already belongs to another commit.');
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data; }
            catch (e) { if (e.status !== 404) throw e; }
            const body = fs.readFileSync('docs/RELEASE_1.1.md', 'utf8') + '\n\nSource for all four packages: [' + context.sha.slice(0, 7) + '](https://github.com/' + owner + '/' + repo + '/tree/' + context.sha + '), also included in each package.';
            if (!ref) await github.rest.git.createRef({owner, repo, ref: 'refs/tags/' + tag, sha: context.sha});
            if (!release) release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: context.sha, name: 'Wigglinde 1.1', body, draft: true, prerelease: false})).data;
            for (const asset of verified) {
              let existing = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id})).data.find(a => a.name === asset.name);
              if (existing && (existing.digest !== asset.digest || existing.size !== asset.size)) throw new Error('Existing 1.1 asset differs; refusing replacement: ' + asset.name);
              if (!existing) existing = (await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name: asset.name, data: asset.data, headers: {'content-type': asset.name.endsWith('.zip') ? 'application/zip' : 'application/gzip', 'content-length': asset.size}})).data;
              if (existing.digest !== asset.digest || existing.size !== asset.size) throw new Error('Uploaded asset differs: ' + asset.name);
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, name: 'Wigglinde 1.1', body, draft: false, prerelease: false, make_latest: 'true'});
            const final = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            if (final.draft || final.prerelease || !verified.every(v => final.assets.some(a => a.name === v.name && a.digest === v.digest && a.size === v.size))) throw new Error('Final release verification failed.');
            core.notice('Published Wigglinde 1.1: ' + final.html_url);
