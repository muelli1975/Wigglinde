name: LAS2 model comparison test build
on:
  push:
    branches: [test-models-1.1]
    paths: ['src/**', 'tools/**', 'tests/**', 'launch.py', 'pyproject.toml', 'README.md', 'README_DE.md', 'THIRD_PARTY.md', 'BUILD.md', 'LICENSE', 'assets/**', '.github/workflows/models-test-build.yml', '.github/workflows/unix-release-build.yml', '.github/workflows/publish-1.0.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  ORT_DISABLE_TELEMETRY: '1'
concurrency:
  group: wigglinde-model-test
  cancel-in-progress: true
jobs:
  models:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Development dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . onnx==1.17.0 timm==1.0.30
      - name: Pinned LAS2 source and weights
        shell: python
        run: |
          from pathlib import Path
          import hashlib,subprocess,urllib.request,runpy
          subprocess.run(['git','clone','https://github.com/TomTomTommi/LiteAnyStereo.git','las2-reference'],check=True)
          subprocess.run(['git','-C','las2-reference','checkout','8c97bd4c4da3712c2ac60003a23201dfdb5935f4'],check=True)
          hashes=runpy.run_path('tools/export_las2.py')['WEIGHTS']
          for label in 'SML':
            filename=f'LAS2_{label}.pth'
            urllib.request.urlretrieve('https://huggingface.co/tomtomtommi/LiteAnyStereoV2/resolve/17788d91618646fa781a14462e2926a034b9f49d/'+filename,filename)
            assert hashlib.sha256(Path(filename).read_bytes()).hexdigest()==hashes[label.lower()]
      - name: Export and verify native S M L Float32 models
        shell: python
        run: |
          import subprocess,sys
          for label in 'SML':
            model=f'models/las2/LAS2_{label}_dynamic.onnx'
            subprocess.run([sys.executable,'tools/export_las2.py','--model-size',label.lower(),'--source','las2-reference','--weights',f'LAS2_{label}.pth','--output',model],check=True)
      - name: Source checks
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: las2-sml-onnx
          path: |
            models/las2/LAS2_S_*
            models/las2/LAS2_M_*
            models/las2/LAS2_L_*
          if-no-files-found: error
          retention-days: 30
  windows:
    needs: models
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: las2-h-onnx
          run-id: 39041230523
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: models/las2
      - uses: actions/download-artifact@v4
        with:
          name: directml-no-telemetry
          run-id: 39041230523
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runtime-wheel
      - uses: actions/download-artifact@v4
        with:
          name: las2-sml-onnx
          path: models/las2
      - name: Install application and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install (Get-ChildItem runtime-wheel/*.whl).FullName
          python -m pip install -e . pyinstaller
      - name: Get pinned native prerequisites
        shell: pwsh
        run: |
          git clone https://gitlab.com/mpeg-i-visual/rvs.git rvs-reference
          git -C rvs-reference checkout d757a353c7f84d228ac30c179d6ff9de356c6101
          git clone https://github.com/TomTomTommi/LiteAnyStereo.git las2-reference
          git -C las2-reference checkout 8c97bd4c4da3712c2ac60003a23201dfdb5935f4
          curl.exe -fL --retry 3 -o opencv.exe https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe
          if ((Get-FileHash opencv.exe -Algorithm SHA256).Hash.ToLower() -ne 'bff38466091c313dac21a0b73eea8278316a89c1d434c6f0b10697e087670168') { throw 'OpenCV checksum mismatch' }
          7z x opencv.exe -oopencv-sdk -y | Out-Null
      - name: Build the RVS CPU backend
        shell: pwsh
        run: |
          cmake -S tools/rvs/runtime -B build/rvs -DRVS_SOURCE_DIR="$pwd/rvs-reference" -DOpenCV_DIR="$pwd/opencv-sdk/opencv/build/x64/vc16/lib"
          cmake --build build/rvs --config Release --parallel 4
      - name: Fast geometry and export checks
        run: python -m unittest discover -s tests -v
      - name: Verify serial and parallel native RVS output
        shell: pwsh
        run: |
          $env:PATH = "$pwd/opencv-sdk/opencv/build/x64/vc16/bin;$env:PATH"
          Get-ChildItem 'C:/Program Files/Microsoft Visual Studio/*/*/VC/Redist/MSVC/*/x64/Microsoft.VC*.OpenMP/vcomp140.dll' | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName build/rvs/Release/ }
          python tools/rvs/check_parallel.py --renderer build/rvs/Release/wigglinde_rvs.exe --output output/rvs-parallel.json
      - name: Package and test the actual Windows application
        run: python tools/package_windows.py --opencv opencv-sdk/opencv --rvs rvs-reference --las2 las2-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wigglinde-1.1-Test3-Windows_x64
          path: |
            dist/Wigglinde_1.1_Test3_Windows_x64.zip
            output/package-verification.json
            output/windows-smoke.json
            output/gui-build-check.png
            output/rvs-parallel.json
          if-no-files-found: warn
          retention-days: 30
